name: Provider Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  provider-tests:
    permissions:
      contents: read
      packages: write
    name: ${{ matrix.provider }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: ollama
          - provider: lmstudio
          - provider: llamacpp
          - provider: vllm
          - provider: llamaswap
          - provider: exo
            compose_service: exo
          - provider: omlx
            compose_service: omlx
          - provider: mlxvlm
            compose_service: mlx-vlm
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: matrix.compose_service
        run: docker compose -f tests/docker/compose.providers.yml build "${{ matrix.compose_service }}"

      - name: Run ${{ matrix.provider }} suite
        run: PROVIDER_SUITE="${{ matrix.provider }}" bun test ./tests/providers.test.ts

  opencode-tests:
    name: opencode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run opencode llama.cpp suite
        run: bun test ./tests/opencode.models.test.ts
